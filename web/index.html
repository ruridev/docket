<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Docket</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<script src="theme.js"></script>
<link rel="stylesheet" href="style.css">
<script src="i18n.js"></script>
</head>
<body>
<header class="hdr">
  <button class="brand" id="brand" type="button">
    <svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><path d="M30 9q1-6 7-5M33 9q3-3 6-1"/><circle cx="32" cy="34" r="24" fill="#f2c94c"/><circle cx="23" cy="29" r="3.2" fill="#1f2328" stroke="none"/><circle cx="41" cy="29" r="3.2" fill="#1f2328" stroke="none"/><circle cx="24" cy="28" r="1" fill="#fff" stroke="none"/><circle cx="42" cy="28" r="1" fill="#fff" stroke="none"/><ellipse cx="32" cy="39" rx="9" ry="5" fill="#f2994a"/><path d="M24 39h16"/><circle cx="15" cy="37" r="3" fill="#f4a6a6" stroke="none"/><circle cx="49" cy="37" r="3" fill="#f4a6a6" stroke="none"/></svg>
    <span class="brand-name">Docket</span>
  </button>
  <div class="hdr-counts" id="counts"></div>
  <div class="hdr-mid" id="current"></div>
  <div class="hdr-tools" id="viewTools"></div>
  <button class="icon-btn" id="addBtn" type="button">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  </button>
  <button class="icon-btn" id="settingsBtn" type="button">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>
  </button>
</header>
<main class="home" id="home"></main>
<main class="view" id="view" hidden>
  <div id="banner"></div>
  <div class="frames" id="frames"></div>
  <div class="state" id="state" hidden></div>
</main>
<div id="modal"></div>
<div id="toastBox"></div>
<script src="app.js"></script>
</body>
</html>
